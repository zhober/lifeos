name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Layout check
        run: node tools/check-layout.mjs
      - name: Deploy a fresh vault and check it
        run: |
          node tools/deploy.mjs "$RUNNER_TEMP/vault" --apply
          cd "$RUNNER_TEMP/vault"
          node tools/check-layout.mjs
          node tools/context.mjs
